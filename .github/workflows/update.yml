name: Update POTA stats

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: pota-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build page
        run: python3 build.py
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add index.html profile.json data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update POTA stats"
            git pull --rebase -X theirs origin main
            git push
          fi
